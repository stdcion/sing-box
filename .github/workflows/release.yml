name: Release Router Binary

on:
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.4
      - name: Debug git tags
        run: |
          echo "=== git describe ==="
          git describe --tags || echo "FAILED"
          git describe --tags --abbrev=0 || echo "FAILED"
          echo "=== recent tags ==="
          git tag --sort=-creatordate | head -10
      - name: Set version
        run: |
          set -xeuo pipefail
          VERSION=$(go run ./cmd/internal/read_tag)
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          set -xeuo pipefail
          go build -v -trimpath -o sing-box \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0' \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -X 'internal/godebug.defaultGODEBUG=multipathtcp=0' -s -buildid= -checklinkname=0" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
      - name: Archive
        run: tar -czf sing-box-linux-arm64.tar.gz sing-box
      - name: Upload release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest sing-box-linux-arm64.tar.gz \
            --title "sing-box ${VERSION}" \
            --notes "Rolling release for router (linux-arm64, no CGO/naive)" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
